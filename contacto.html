<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto | Órale K Rico</title>
<meta name="description" content="¿Dudas o pedidos grandes? Escríbenos por WhatsApp — dirección, horario y ubicación de Órale K Rico.">

<!-- ⚠️ Cuando tengas el dominio del sitio, reemplaza TU-DOMINIO-AQUI.com por el real en todas las páginas (busca y reemplaza) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Órale K Rico">
<meta property="og:title" content="Contacto | Órale K Rico">
<meta property="og:description" content="¿Dudas o pedidos grandes? Escríbenos por WhatsApp.">
<meta property="og:image" content="https://TU-DOMINIO-AQUI.com/img/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://TU-DOMINIO-AQUI.com/contacto.html">
<meta property="og:locale" content="es_CO">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Contacto | Órale K Rico">
<meta name="twitter:description" content="¿Dudas o pedidos grandes? Escríbenos por WhatsApp.">
<meta name="twitter:image" content="https://TU-DOMINIO-AQUI.com/img/og-image.jpg">

<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/favicon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero has-bg" style="--hero-img:url('/img/tacos-mesa.jpg');">
  <div class="page-hero-inner">
    <h1>CONTÁCTANOS</h1>
    <p>¿Dudas o pedidos grandes? Escríbenos.</p>
  </div>
</section>

<section class="section">
  <div class="contact-layout">
    <div class="contact-card">
      <h3>Información de contacto</h3>
      <div class="contact-row">
        <svg class="ic-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>
        <div><h4>Dirección</h4><p id="cAddress"></p></div>
      </div>
      <div class="contact-row">
        <svg class="ic-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <div><h4>Horario</h4><p id="cHours"></p></div>
      </div>
      <div class="contact-row">
        <svg class="ic-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5c0-1.1.9-2 2-2h2l2 5-2 2c1 3 3 5 6 6l2-2 5 2v2c0 1.1-.9 2-2 2C10 20 4 14 4 5z"/></svg>
        <div><h4>Teléfono / WhatsApp</h4><p id="cPhone"></p></div>
      </div>
      <div class="contact-row" id="cInstaRow">
        <svg class="ic-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>
        <div><h4>Instagram</h4><a id="cInsta" target="_blank" rel="noopener" style="color:var(--turquesa);"></a></div>
      </div>
      <a id="waLink" class="cta-btn" target="_blank" rel="noopener" style="width:100%; text-align:center; margin-top:8px; justify-content:center;">Escribir por WhatsApp</a>
    </div>

    <div class="contact-card">
      <h3>Escríbenos un mensaje</h3>
      <div class="form-group"><label>Nombre completo</label><input type="text" id="fmName" placeholder="Ej: Ana Gómez"></div>
      <div class="form-group"><label>Número de teléfono</label><input type="tel" id="fmPhone" placeholder="Ej: 3001234567"></div>
      <div class="form-group">
        <label>Motivo</label>
        <select id="fmReason">
          <option value="Pedido grande / evento">Pedido grande o evento</option>
          <option value="Pregunta general">Pregunta general</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="form-group"><label>Mensaje</label><textarea id="fmMessage" rows="4" placeholder="Cuéntanos en qué te podemos ayudar..."></textarea></div>
      <button type="button" class="cta-btn" id="fmSendBtn" style="width:100%; justify-content:center;">Enviar mensaje por WhatsApp</button>
    </div>

    <div class="map-wrap map-frame">
      <iframe id="mapFrame" src="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Carrito de compra">
  <div class="drawer-head"><h3 id="drawerTitle">Tu pedido</h3><button class="close-btn" id="closeDrawerBtn">✕</button></div>
  <div class="drawer-body" id="cartView">
    <div class="empty-cart" id="emptyCart">Aún no has agregado nada.<br>Ve al menú y arma tu antojo.<br><br><a href="menu.html" class="cta-btn" style="margin-top:10px;">Ir al menú</a></div>
    <div id="cartLines"></div>
  </div>
  <div class="drawer-foot" id="cartFoot" style="display:none;">
    <div class="subtotal-row"><span>Total</span><span id="subtotalVal">$0</span></div>
    <a href="menu.html" class="checkout-btn" style="display:block; text-align:center; text-decoration:none;">Ir al menú a continuar ➜</a>
  </div>
</aside>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', ()=>{
    const s = okrGetSettings();
    document.getElementById('cAddress').textContent = s.address;
    document.getElementById('cHours').textContent = s.hours;
    document.getElementById('cPhone').textContent = s.phone;
    document.getElementById('waLink').href = `https://wa.me/${s.whatsapp}`;
    document.getElementById('mapFrame').src = `https://maps.google.com/maps?q=${encodeURIComponent(s.address)}&output=embed`;

    if(s.instagram){
      document.getElementById('cInsta').href = s.instagram;
      document.getElementById('cInsta').textContent = s.instagram.replace(/https?:\/\/(www\.)?instagram\.com\//,'@').replace(/\/?\?.*$/,'');
    } else {
      document.getElementById('cInstaRow').classList.add('hidden');
    }

    document.getElementById('fmSendBtn').addEventListener('click', ()=>{
      const name = document.getElementById('fmName').value.trim();
      const phone = document.getElementById('fmPhone').value.trim();
      const reason = document.getElementById('fmReason').value;
      const message = document.getElementById('fmMessage').value.trim();

      if(!name || !phone || !message){
        alert('Por favor completa tu nombre, teléfono y mensaje.');
        return;
      }

      let msg = `*Mensaje desde la página — ${s.name}*\n`;
      msg += `-------------------------\n\n`;
      msg += `*Nombre:* ${name}\n`;
      msg += `*Teléfono:* ${phone}\n`;
      msg += `*Motivo:* ${reason}\n\n`;
      msg += `*Mensaje:*\n${message}`;

      window.open(`https://wa.me/${s.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
    });
  });
</script>
</body>
</html>
